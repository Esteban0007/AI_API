{% extends "base.html" %} {% block title %}Dashboard - SemanticSearch AI{% endblock
%} {% block content %}
<div class="container" style="max-width: 1200px">
  <!-- Dashboard Header -->
  <div style="margin-bottom: 3rem; margin-top: 2rem">
    <h1
      style="
        margin-bottom: 0.5rem;
        background: linear-gradient(135deg, #00f2fe 0%, #4facfe 50%, #667eea 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        font-weight: 800;
        letter-spacing: -0.025em;
      "
    >
      Neural Dashboard
    </h1>
    <p style="color: #94a3b8; font-size: 1.05rem">
      Real-time telemetry, core vector storage, and quantum API analytics.
    </p>
    <div
      style="
        height: 1px;
        background: linear-gradient(
          90deg,
          rgba(0, 242, 254, 0.5),
          rgba(102, 126, 234, 0.2),
          transparent
        );
        margin-top: 1.5rem;
        margin-bottom: 1.5rem;
      "
    ></div>
  </div>

  <div id="dashboard" style="min-height: 400px">
    <article
      style="
        text-align: center;
        padding: 4rem;
        background: rgba(15, 23, 42, 0.7);
        border: 1px solid rgba(0, 242, 254, 0.2);
        border-radius: 12px;
        box-shadow: 0 0 20px rgba(0, 242, 254, 0.05);
      "
    >
      <div class="loading-pulse" style="color: #00f2fe; font-size: 1.1rem; font-family: 'JetBrains Mono', monospace;">
        ⚡ Initializing telemetry stream...
      </div>
    </article>
  </div>
</div>

<style>
  .stat-card {
    background: linear-gradient(145deg, rgba(15, 23, 42, 0.9) 0%, rgba(30, 41, 59, 0.8) 100%);
    border: 1px solid rgba(100, 116, 139, 0.3);
    border-radius: 12px;
    padding: 2rem;
    text-align: center;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
    overflow: hidden;
  }

  .stat-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 2px;
    background: linear-gradient(90deg, transparent, #00f2fe, transparent);
    opacity: 0;
    transition: opacity 0.3s;
  }

  .stat-card:hover {
    transform: translateY(-4px);
    border-color: rgba(0, 242, 254, 0.5);
    box-shadow: 0 10px 30px -10px rgba(0, 242, 254, 0.2);
  }

  .stat-card:hover::before {
    opacity: 1;
  }

  .stat-value {
    font-size: 2.8rem;
    font-weight: 800;
    background: linear-gradient(135deg, #fff 30%, #94a3b8 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin: 1rem 0;
    font-family: 'JetBrains Mono', monospace;
  }

  .stat-label {
    color: #94a3b8;
    font-size: 0.9rem;
    letter-spacing: 0.025em;
  }

  .stat-icon {
    font-size: 2rem;
    filter: drop-shadow(0 0 10px rgba(0, 242, 254, 0.3));
  }

  .section-title {
    font-size: 1.4rem;
    font-weight: 700;
    margin: 2.5rem 0 1rem 0;
    padding-bottom: 0.75rem;
    border-bottom: 1px solid rgba(100, 116, 139, 0.3);
    color: #f8fafc;
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }

  .api-key-container {
    background: rgba(15, 23, 42, 0.8);
    border: 1px solid rgba(0, 242, 254, 0.3);
    border-radius: 12px;
    padding: 2rem;
    margin-bottom: 1.5rem;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
  }

  .btn-group {
    display: flex;
    gap: 1rem;
    margin-top: 1rem;
  }

  .btn-group button {
    background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
    color: #0f172a;
    font-weight: 600;
    border: none;
    border-radius: 8px;
    padding: 0.75rem 1.5rem;
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn-group button:hover {
    opacity: 0.9;
    transform: translateY(-1px);
    box-shadow: 0 0 15px rgba(0, 242, 254, 0.4);
  }

  .btn-group button.secondary {
    background: rgba(30, 41, 59, 0.9);
    color: #00f2fe;
    border: 1px solid rgba(0, 242, 254, 0.4);
  }

  .btn-group button.secondary:hover {
    background: rgba(0, 242, 254, 0.1);
  }

  article {
    background: rgba(15, 23, 42, 0.6);
    border: 1px solid rgba(100, 116, 139, 0.2);
    border-radius: 12px;
    padding: 2rem;
    backdrop-filter: blur(10px);
  }

  @media (max-width: 768px) {
    .stat-card {
      padding: 1.5rem;
    }
    .stat-value {
      font-size: 2rem;
    }
    .btn-group {
      flex-direction: column;
    }
  }
</style>

<script>
  const API_BASE = "/api/v1";

  // Get API key from localStorage
  let API_KEY = localStorage.getItem("api_key");
  const USER_EMAIL = localStorage.getItem("user_email");

  // Escape HTML to prevent XSS
  function escapeHtml(text) {
    const div = document.createElement("div");
    div.textContent = text;
    return div.innerHTML;
  }

  // Load dashboard data
  if (!API_KEY) {
    showError(
      "Not Authenticated",
      "Your session has expired. Please log in again to access your dashboard.",
    );
  } else {
    loadDashboard();
  }

  async function loadDashboard() {
    try {
      const monthlyResponse = await fetch(API_BASE + "/search/stats/monthly", {
        headers: { "X-API-Key": API_KEY },
      });

      if (!monthlyResponse.ok) {
        throw new Error("Failed to load dashboard stats");
      }

      const monthlyStats = await monthlyResponse.json();

      // Load documents stats
      const statsResponse = await fetch(API_BASE + "/documents/stats", {
        headers: { "X-API-Key": API_KEY },
      });

      let documentCount = 0;
      if (statsResponse.ok) {
        const stats = await statsResponse.json();
        documentCount = stats.document_count || 0;
      }

      // Load full documents list
      const documentsResponse = await fetch(API_BASE + "/documents/all", {
        headers: { "X-API-Key": API_KEY },
      });

      let documents = [];
      if (documentsResponse.ok) {
        const docsData = await documentsResponse.json();
        documents = docsData.documents || [];
      }

      displayDashboard(monthlyStats, documents, documentCount);
    } catch (error) {
      console.error(error);
      showError("Error Loading Dashboard", error.message);
    }
  }

  function displayDashboard(monthlyStats, documents, documentCount) {
    const docCount = documentCount || documents?.length || 0;

    const html = `
      <!-- Statistics Cards -->
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1.5rem; margin-bottom: 3rem;">
        <!-- Monthly Searches Card -->
        <div class="stat-card">
          <div class="stat-icon">📈</div>
          <h3 style="margin: 1rem 0 0.5rem 0; color: #f8fafc; font-size: 1.1rem;">Monthly Searches</h3>
          <div class="stat-value">${monthlyStats.total_searches}</div>
          <p class="stat-label">Total queries in <strong style="color: #00f2fe;">${monthlyStats.month}</strong></p>
        </div>

        <!-- Documents Card -->
        <div class="stat-card">
          <div class="stat-icon">📄</div>
          <h3 style="margin: 1rem 0 0.5rem 0; color: #f8fafc; font-size: 1.1rem;">Indexed Documents</h3>
          <div class="stat-value">${docCount}</div>
          <p class="stat-label">Active vector nodes</p>
        </div>

        <!-- Status Card -->
        <div class="stat-card">
          <div class="stat-icon">🟢</div>
          <h3 style="margin: 1rem 0 0.5rem 0; color: #f8fafc; font-size: 1.1rem;">System Status</h3>
          <div class="stat-value" style="color: #10b981; font-size: 2.2rem; text-shadow: 0 0 15px rgba(16, 185, 129, 0.3);">ONLINE</div>
          <p class="stat-label">API handshake operational</p>
        </div>
      </div>

      <!-- Documents Section -->
      <article style="margin-top: 3rem;">
        <h2 class="section-title">📚 Neural Document Registry</h2>
        
        <p style="color: #94a3b8; margin-bottom: 1.5rem;">
          Query and manage your dataset indexed through the SemanticSearch API engine.
        </p>

        ${
          docCount === 0
            ? `
          <div style="text-align: center; padding: 3rem; background: rgba(30, 41, 59, 0.4); border-radius: 12px; border: 1px dashed rgba(0, 242, 254, 0.3);">
            <p style="color: #94a3b8; font-size: 1rem;">No documents indexed yet.</p>
            <p style="color: #94a3b8; font-size: 0.9rem;">Upload documentation to start querying. Visit the <a href="/api-docs" style="color: #00f2fe; text-decoration: none;">API Docs</a> for implementation protocols.</p>
          </div>
        `
            : `
          <div style="overflow-y: auto; max-height: 500px; border: 1px solid rgba(100, 116, 139, 0.3); border-radius: 12px; background: rgba(10, 15, 30, 0.8);">
            <table role="grid" style="width: 100%; border-collapse: collapse; margin-bottom: 0;">
              <thead style="position: sticky; top: 0; background: rgba(15, 23, 42, 0.95); z-index: 10; backdrop-filter: blur(5px);">
                <tr>
                  <th style="text-align: left; padding: 1rem 1.25rem; border-bottom: 1px solid rgba(100, 116, 139, 0.3); color: #00f2fe; font-family: 'JetBrains Mono', monospace; font-size: 0.85rem;">TITLE</th>
                  <th style="text-align: left; padding: 1rem 1.25rem; border-bottom: 1px solid rgba(100, 116, 139, 0.3); color: #00f2fe; font-family: 'JetBrains Mono', monospace; font-size: 0.85rem;">CONTENT PREVIEW</th>
                  <th style="text-align: center; padding: 1rem 1.25rem; border-bottom: 1px solid rgba(100, 116, 139, 0.3); color: #00f2fe; font-family: 'JetBrains Mono', monospace; font-size: 0.85rem;">TAGS</th>
                </tr>
              </thead>
              <tbody>
                ${documents
                  .map((doc) => {
                    const title = doc.title || doc.id;
                    const keywordArray = Array.isArray(doc.keywords)
                      ? doc.keywords
                      : [];
                    const keywordCount = keywordArray.length;
                    const contentPreview = escapeHtml(
                      (doc.content || "").substring(0, 80),
                    );
                    return `
                  <tr style="border-bottom: 1px solid rgba(100, 116, 139, 0.15); transition: background 0.2s;" onmouseover="this.style.background='rgba(0, 242, 254, 0.03)'" onmouseout="this.style.background='transparent'">
                    <td style="padding: 1rem 1.25rem; font-weight: 600; color: #f8fafc;">${escapeHtml(title)}</td>
                    <td style="padding: 1rem 1.25rem; color: #94a3b8; font-size: 0.9rem; font-family: 'JetBrains Mono', monospace;">
                      ${contentPreview}${(doc.content || "").length > 80 ? "..." : ""}
                    </td>
                    <td style="padding: 1rem 1.25rem; text-align: center; color: #00f2fe; font-size: 0.85rem; font-family: 'JetBrains Mono', monospace;">
                      ${keywordCount} tag${keywordCount !== 1 ? "s" : ""}
                    </td>
                  </tr>`;
                  })
                  .join("")}
              </tbody>
            </table>
          </div>
          <p style="color: #94a3b8; margin-top: 1rem; font-size: 0.9rem;">
            Total items in core: <strong style="color: #f8fafc;">${docCount}</strong> document${docCount !== 1 ? "s" : ""}
          </p>
        `
        }
      </article>

      <!-- API Keys Section -->
      <article style="margin-top: 3rem;">
        <h2 class="section-title">🔐 Neural API Key Cryptographic Token</h2>
        
        <p style="color: #94a3b8; margin-bottom: 1.5rem;">
          Secure access token for programmatic requests to the SemanticSearch AI core. Keep this confidential.
        </p>

        <div class="api-key-container">
          <label style="display: block; margin-bottom: 0.5rem; font-weight: 600; color: #00f2fe; font-family: 'JetBrains Mono', monospace; font-size: 0.85rem;">ACTIVE ACCESS TOKEN</label>
          <input 
            type="password" 
            value="${API_KEY}" 
            readonly 
            style="width: 100%; padding: 0.85rem 1rem; font-family: 'JetBrains Mono', monospace; font-size: 0.9rem; margin-bottom: 1rem; border: 1px solid rgba(0, 242, 254, 0.3); border-radius: 8px; background: rgba(10, 15, 30, 0.9); color: #00f2fe;"
            id="api-key-input"
          >
          
          <div class="btn-group">
            <button type="button" onclick="copyAPI()" style="flex: 1;">📋 Copy Token</button>
            <button type="button" onclick="revealKey()" class="secondary" style="flex: 1;">👁️ Toggle Visibility</button>
          </div>

          <p style="color: #10b981; margin-top: 1rem; font-size: 0.9rem; display: flex; align-items: center; gap: 0.5rem;">
            <span>🟢</span> <strong>Status: Authorized & Active</strong>
          </p>
        </div>
      </article>

      <!-- Usage Instructions -->
      <article style="margin-top: 2rem;">
        <h3 style="color: #f8fafc; font-size: 1.2rem; margin-bottom: 0.75rem;">⚡ Programmatic Execution Example</h3>
        <p style="color: #94a3b8;">Pass your token via the <code>X-API-Key</code> request header:</p>
        <pre style="background: rgba(10, 15, 30, 0.9); border: 1px solid rgba(0, 242, 254, 0.3); padding: 1.25rem; border-radius: 8px; overflow-x: auto; font-size: 0.85rem; font-family: 'JetBrains Mono', monospace; color: #00f2fe;"><code>curl -H "X-API-Key: YOUR_API_KEY" https://api.semanticsearch.io/api/v1/search/query</code></pre>
        <p style="color: #94a3b8; font-size: 0.9rem; margin-top: 1rem;">
          Review complete reference manuals in the <a href="/api-docs" style="color: #00f2fe; text-decoration: none;">API Docs</a>.
        </p>
      </article>
    `;

    document.getElementById("dashboard").innerHTML = html;
  }

  function showError(title, message) {
    document.getElementById("dashboard").innerHTML = `
      <article style="text-align: center; padding: 3rem; background-color: rgba(239, 68, 68, 0.1); border-color: rgba(239, 68, 68, 0.3); border-radius: 12px;">
        <p style="color: #f87171; margin-bottom: 1.5rem; font-weight: 600;">Authentication Session Expired or Invalid.</p>
        <a href="/login" style="display: inline-block; background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%); color: white; padding: 0.75rem 1.5rem; border-radius: 8px; text-decoration: none; font-weight: 600;">Re-authenticate</a>
      </article>
    `;
  }

  function copyAPI() {
    const input = document.getElementById("api-key-input");
    input.select();
    navigator.clipboard.writeText(API_KEY).then(() => {
      const btn = event.target;
      const originalText = btn.textContent;
      btn.textContent = "✅ Copied!";
      setTimeout(() => {
        btn.textContent = originalText;
      }, 2000);
    });
  }

  function revealKey() {
    const input = document.getElementById("api-key-input");
    input.type = input.type === "password" ? "text" : "password";
  }
</script>
{% endblock %}
