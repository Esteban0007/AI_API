<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Semantic Search API for Developers | JSON In/Out - ReadyAPI{% endblock %}</title>
    
    <!-- SEO Meta Tags -->
    <meta name="description" content="Skip vector database setup and model selection. ReadyAPI offers a fast, plug-and-play semantic search API with simple JSON in/out integration. Get your API key today.">
    <meta name="keywords" content="semantic search api, vector database alternative, AI search for developers, json search api, text embeddings api, natural language search">
    <link rel="canonical" href="https://readyapi.net/">

    <!-- Open Graph / Social Media Meta Tags -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://readyapi.net/">
    <meta property="og:title" content="Semantic Search API for Developers | JSON In/Out">
    <meta property="og:description" content="No vector DBs or model management. Plug in your API key and get instant AI-powered semantic search via JSON.">
    <meta property="og:image" content="https://readyapi.net/static/logo.png">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="https://readyapi.net/">
    <meta name="twitter:title" content="Semantic Search API for Developers | JSON In/Out">
    <meta name="twitter:description" content="No vector DBs or model management. Plug in your API key and get instant AI-powered semantic search via JSON.">
    <meta name="twitter:image" content="https://readyapi.net/static/logo.png">

    <!-- Schema.org Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "ReadyAPI Semantic Search",
      "operatingSystem": "All",
      "applicationCategory": "DeveloperApplication",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "description": "Plug-and-play semantic search API for developers. JSON in, JSON out. No vector database configuration or ML expertise required.",
      "url": "https://readyapi.net/"
    }
    </script>

    <link rel="icon" type="image/x-icon" href="/static/favicon.ico" />
    <link rel="apple-touch-icon" href="/static/logo.png" />
    <!-- Google Fonts: Inter and Space Grotesk for futuristic cyber tech vibe -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/htmx.org"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              cyber: {
                950: '#030712',
                900: '#0a0f1d',
                800: '#111827',
                700: '#1f293d',
                600: '#374151',
                cyan: '#00f2fe',
                indigo: '#4facfe',
                purple: '#7928ca',
                neon: '#10b981'
              }
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              display: ['Space Grotesk', 'sans-serif'],
            },
          }
        }
      }
    </script>
    <style>
      :root {
        --bg-primary: #080d19;
        --bg-surface: #10182a;
        --bg-surface-2: #162137;
        --text-primary: #f8fafc;
        --text-muted: #94a3b8;
        --accent: #22d3ee;
        --accent-2: #2dd4bf;
        --border-soft: rgba(148, 163, 184, 0.26);
        --form-element-border-color: rgba(34, 211, 238, 0.28);
        --muted-color: #94a3b8;
      }

      html, body {
        margin: 0;
        padding: 0;
      }

      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background-color: var(--bg-primary);
        color: #f8fafc;
        background-image: 
          radial-gradient(circle at 50% 0%, rgba(79, 172, 254, 0.08) 0%, transparent 50%),
          linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
        background-size: 100% 100%, 40px 40px, 40px 40px;
        min-height: 100vh;
        overflow-x: hidden;
        padding-top: 4.5rem; /* Deja espacio exacto para que el contenido no quede debajo del nav fijo */
      }

      /* Cybernetic Glow Elements */
      .cyber-glow-cyan {
        box-shadow: 0 0 20px rgba(0, 242, 254, 0.25);
      }
      .cyber-glow-indigo {
        box-shadow: 0 0 25px rgba(79, 172, 254, 0.3);
      }
      .glass-panel {
        background: rgba(10, 15, 29, 0.75);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(0, 242, 254, 0.15);
      }
      .glass-dropdown {
        background: rgba(10, 15, 29, 0.98) !important;
        backdrop-filter: blur(20px);
        border: 1px solid rgba(0, 242, 254, 0.3) !important;
      }

      nav {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        box-sizing: border-box;
        padding: 0.8rem 2rem;
        background: rgba(8, 13, 25, 0.92);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border-bottom: 1px solid rgba(148, 163, 184, 0.2);
        z-index: 9999;
      }
      nav a {
        text-decoration: none;
      }
      .site-nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
        position: relative;
        flex-wrap: nowrap;
        background: transparent;
        gap: 1rem;
        width: 100%;
      }
      .nav-brand {
        display: inline-flex;
        align-items: center;
        gap: 0.65rem;
        min-width: fit-content;
        margin-right: 1.25rem;
      }
      .nav-brand img {
        width: 34px;
        height: 34px;
        border-radius: 999px;
        object-fit: cover;
        border: 1px solid rgba(34, 211, 238, 0.35);
      }
      .nav-brand span {
        color: var(--text-primary);
        font-family: "Space Grotesk", sans-serif;
        font-weight: 600;
        font-size: 1rem;
        letter-spacing: 0.01em;
      }
      .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 2rem;
      }
      .hero {
        text-align: center;
        padding: 4rem 2rem;
      }
      .hero h1 {
        font-family: 'Space Grotesk', sans-serif;
        font-size: 2.5rem;
        margin-bottom: 1rem;
        background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        text-shadow: 0 0 30px rgba(0, 242, 254, 0.3);
      }
      .hero p {
        font-size: 1.1rem;
        color: var(--muted-color);
        margin-bottom: 2rem;
      }
      .features {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 2rem;
        margin: 3rem 0;
      }
      .feature-card {
        padding: 2rem;
        border: 1px solid rgba(0, 242, 254, 0.15);
        border-radius: 12px;
        background: rgba(17, 24, 39, 0.6);
        backdrop-filter: blur(12px);
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .feature-card:hover {
        border-color: rgba(0, 242, 254, 0.5);
        box-shadow: 0 0 30px rgba(0, 242, 254, 0.15);
        transform: translateY(-4px);
      }
      .feature-card h3 {
        margin-top: 0;
        font-family: 'Space Grotesk', sans-serif;
        color: #f8fafc;
      }
      .movie-card {
        border: 1px solid rgba(0, 242, 254, 0.15);
        border-radius: 12px;
        padding: 1.25rem;
        margin-bottom: 1rem;
        display: flex;
        gap: 1rem;
        align-items: flex-start;
        background: rgba(17, 24, 39, 0.6);
        backdrop-filter: blur(12px);
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .movie-card:hover {
        border-color: rgba(0, 242, 254, 0.5);
        box-shadow: 0 8px 24px rgba(0, 242, 254, 0.15);
        transform: translateY(-2px);
      }
      .movie-info {
        flex: 1;
        min-width: 0;
      }
      .movie-title {
        font-weight: bold;
        font-size: 1.1rem;
        margin-bottom: 0.3rem;
        word-break: break-word;
        color: #f8fafc;
      }
      .movie-year {
        color: var(--muted-color);
        font-size: 0.85rem;
      }
      .score-badge {
        background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        color: white;
        padding: 0.5rem 1rem;
        border-radius: 8px;
        font-weight: bold;
        margin-left: 1rem;
        box-shadow: 0 0 15px rgba(16, 185, 129, 0.3);
      }
      .fast-path-badge {
        background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
        color: #030712;
        font-weight: 700;
        padding: 0.25rem 0.75rem;
        border-radius: 9999px;
        font-size: 0.8rem;
        margin-left: 0.5rem;
        box-shadow: 0 0 10px rgba(0, 242, 254, 0.3);
      }
      .search-box {
        position: relative;
      }
      .htmx-request .htmx-indicator {
        display: inline;
      }
      .htmx-indicator {
        display: none;
      }
      .loading {
        color: #00f2fe;
        font-style: italic;
        text-shadow: 0 0 10px rgba(0, 242, 254, 0.4);
      }
      .btn-group {
        display: flex;
        gap: 1rem;
        margin-bottom: 2rem;
      }
      /* Desktop nav-menu styles */
      .nav-menu {
        display: flex !important;
        position: static !important;
        background: transparent !important;
        border: none !important;
        box-shadow: none !important;
        padding: 0 !important;
        gap: 0.5rem !important;
        flex-direction: row !important;
        align-items: center !important;
        justify-content: center !important;
      }
      .nav-menu a {
        color: var(--text-muted) !important;
        padding: 0.48rem 0.82rem !important;
        border: 1px solid transparent !important;
        border-radius: 10px !important;
        background: transparent !important;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1) !important;
        display: inline-block !important;
        font-weight: 500 !important;
        font-size: 0.9rem !important;
        box-shadow: none !important;
      }
      .nav-menu a:hover {
        background: rgba(34, 211, 238, 0.08) !important;
        color: var(--text-primary) !important;
        border-color: rgba(34, 211, 238, 0.32) !important;
        transform: translateY(-1px) !important;
        box-shadow: 0 8px 20px rgba(34, 211, 238, 0.16) !important;
      }
      .nav-menu a.active {
        background: rgba(34, 211, 238, 0.12) !important;
        color: var(--text-primary) !important;
        border-color: rgba(34, 211, 238, 0.45) !important;
        font-weight: 600 !important;
        box-shadow: 0 0 0 1px rgba(34, 211, 238, 0.24) inset !important;
      }
      .nav-action-link {
        text-decoration: none;
        padding: 0.56rem 1.05rem;
        font-size: 0.88rem;
        border-radius: 10px;
        transition: all 0.25s ease;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        white-space: nowrap;
        border: 1px solid transparent;
        font-weight: 600;
      }
      .nav-action-link-secondary {
        border-color: var(--border-soft);
        color: var(--text-primary);
        background: rgba(16, 24, 42, 0.72);
      }
      .nav-action-link-secondary:hover {
        border-color: rgba(34, 211, 238, 0.4);
        background: rgba(34, 211, 238, 0.08);
      }
      .nav-action-link-primary {
        background: linear-gradient(130deg, var(--accent), var(--accent-2));
        color: #04202a;
        box-shadow: 0 8px 24px rgba(34, 211, 238, 0.3);
      }
      .nav-action-link-primary:hover {
        transform: translateY(-1px);
        box-shadow: 0 12px 28px rgba(34, 211, 238, 0.38);
      }
      .user-trigger {
        background: rgba(16, 24, 42, 0.78);
        border: 1px solid var(--border-soft);
        padding: 0.56rem 0.9rem;
        border-radius: 10px;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 0.6rem;
        width: auto;
        justify-content: center;
        font-weight: 500;
        font-size: 0.88rem;
        transition: all 0.3s ease;
      }
      .user-trigger:hover {
        background: rgba(34, 211, 238, 0.1);
        border-color: rgba(34, 211, 238, 0.55);
      }
      .user-dropdown-link {
        display: block;
        padding: 0.75rem 1rem;
        text-decoration: none;
        border-bottom: 1px solid rgba(148, 163, 184, 0.2);
        color: var(--text-primary);
        transition: background-color 0.2s;
      }
      .user-dropdown-link:hover {
        background-color: rgba(34, 211, 238, 0.14);
      }
      .footer-shell {
        text-align: center;
        padding: 2.5rem 2rem;
        color: var(--muted-color);
        border-top: 1px solid rgba(148, 163, 184, 0.2);
        margin-top: 4rem;
        background: rgba(8, 13, 25, 0.75);
        backdrop-filter: blur(10px);
      }
      .footer-link {
        color: #7dd3fc;
        text-decoration: none;
      }
      .footer-link:hover {
        text-decoration: underline;
      }
      @media (max-width: 768px) {
        nav {
          padding: 0.75rem 1rem;
          display: flex;
          justify-content: space-between;
          align-items: center;
          flex-wrap: wrap;
          position: fixed;
          top: 0;
          left: 0;
          width: 100%;
          box-sizing: border-box;
          z-index: 9999;
          overflow: visible;
        }
        .nav-brand span {
          font-size: 0.92rem;
        }
        .hamburger-btn {
          display: block;
          background: rgba(16, 24, 42, 0.85);
          border: 1px solid rgba(148, 163, 184, 0.35);
          border-radius: 8px;
          cursor: pointer;
          font-size: 1.5rem;
          padding: 0.5rem 0.75rem;
          color: #00f2fe;
          transition: all 0.2s;
          order: 1;
        }
        .hamburger-btn:hover {
          background: rgba(0, 242, 254, 0.15);
          box-shadow: 0 0 15px rgba(0, 242, 254, 0.3);
        }
        .nav-menu {
          display: none !important;
          flex-direction: column !important;
          position: absolute !important;
          top: 100% !important;
          left: 0 !important;
          right: 0 !important;
          background: rgba(3, 7, 18, 0.98) !important;
          backdrop-filter: blur(24px) !important;
          border-bottom: 1px solid rgba(148, 163, 184, 0.28) !important;
          border-top: 1px solid rgba(148, 163, 184, 0.28) !important;
          padding: 1rem 0 !important;
          gap: 0.5rem !important;
          width: 100% !important;
          z-index: 9998 !important;
          box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8) !important;
          margin-top: 0 !important;
          margin-left: 0 !important;
          flex: none !important;
        }
        .nav-menu.mobile-open {
          display: flex !important;
        }
        .nav-menu a {
          color: #f8fafc !important;
          padding: 1rem 2rem !important;
          border-bottom: 1px solid rgba(0, 242, 254, 0.1) !important;
          transition: all 0.2s !important;
          text-decoration: none !important;
          display: block !important;
          background-color: transparent !important;
          border-radius: 0 !important;
          font-weight: 600 !important;
          font-size: 1.1rem !important;
          cursor: pointer !important;
          text-align: center !important;
        }
        .nav-menu a:last-child {
          border-bottom: none !important;
        }
        .nav-menu a:hover {
          background-color: rgba(0, 242, 254, 0.15) !important;
          color: #00f2fe !important;
          opacity: 1 !important;
        }
        nav > div:last-child {
          order: 2;
          width: auto;
          display: flex !important;
          justify-content: flex-end;
          gap: 0.5rem;
          margin-top: 0;
          margin-left: auto;
        }
        #user-menu {
          flex: none;
        }
        #user-menu button {
          width: auto;
          justify-content: center;
          font-size: 0.85rem;
        }
        #user-email {
          max-width: 80px;
          overflow: hidden;
          text-overflow: ellipsis;
        }
        #user-dropdown {
          position: absolute !important;
          right: 0 !important;
          left: auto !important;
          top: 100% !important;
          width: auto !important;
          margin-top: 0.5rem !important;
          border-radius: 8px !important;
          box-shadow: 0 10px 30px rgba(0, 0, 0, 0.9) !important;
          border: 1px solid rgba(0, 242, 254, 0.3) !important;
          min-width: 180px !important;
          z-index: 10000 !important;
        }
        #user-dropdown a,
        #user-dropdown button {
          border: none;
          border-bottom: 1px solid rgba(0, 242, 254, 0.1);
          border-radius: 0;
        }
        #user-dropdown a:last-child,
        #user-dropdown button:last-child {
          border-bottom: none;
        }
        #auth-links {
          width: auto;
          flex-direction: row !important;
          gap: 0.5rem;
        }
        #auth-links a {
          text-align: center;
          padding: 0.5rem 0.75rem !important;
          display: block;
          flex: none;
          font-size: 0.85rem;
        }
        .nav-action-link-primary {
          padding: 0.5rem 0.8rem;
        }
        .container {
          padding: 1rem;
        }
        .hero {
          padding: 2rem 1rem;
        }
        .hero h1 {
          font-size: 2rem;
        }
        .btn-group {
          flex-direction: column;
          align-items: stretch;
        }
        .movie-card {
          flex-direction: column;
          align-items: flex-start;
        }
        .movie-card img {
          width: 80px;
          height: 120px;
        }
        .score-badge {
          margin-left: 0;
        }
        .fast-path-badge {
          margin-left: 0.5rem;
        }
      }
    </style>
    {% block extra_css %}{% endblock %}
  </head>
  <body class="bg-cyber-950 text-slate-100 selection:bg-cyan-500 selection:text-slate-950">
    <nav>
      <div class="site-nav">
        <a href="/" class="nav-brand" aria-label="ReadyAPI.net">
          <img src="/static/logo.png" alt="ReadyAPI.net logo" />
          <span>ReadyAPI.net</span>
        </a>
        <!-- Hamburger Button - Left -->
        <button
          class="hamburger-btn"
          id="hamburger-btn"
          onclick="toggleMobileMenu(event)"
          style="
            display: none;
            min-width: fit-content;
            cursor: pointer;
            padding: 0.5rem;
            background: rgba(17, 24, 39, 0.8);
            border: 1px solid rgba(0, 242, 254, 0.3);
            border-radius: 8px;
            font-size: 1.5rem;
            color: #00f2fe;
          "
          aria-label="Toggle menu"
        >
          ☰
        </button>

        <!-- Navigation Menu - Center -->
        <div class="nav-menu" id="nav-menu" style="margin: 0 auto">
          <a href="/" style="text-decoration: none">Home</a>
          <a href="/dashboard" id="nav-dashboard" style="text-decoration: none"
            >Dashboard</a
          >
          <a href="/demos" style="text-decoration: none">Demos</a>
          <a href="/api-docs" style="text-decoration: none">API Docs</a>
        </div>

        <!-- Auth/User Menu - Right -->
        <div
          style="
            display: flex;
            gap: 1rem;
            align-items: center;
            margin-left: auto;
            min-width: fit-content;
          "
        >
          <!-- User Menu (shown when logged in) -->
          <div
            id="user-menu"
            style="display: none; position: relative; width: 100%; z-index: 10000;"
          >
            <button
              onclick="toggleUserMenu(event)"
              class="user-trigger"
            >
              <span
                id="user-email"
                style="
                  font-size: 0.9rem;
                  white-space: nowrap;
                  overflow: hidden;
                  text-overflow: ellipsis;
                  max-width: 150px;
                  color: #00f2fe;
                  font-weight: 600;
                "
              ></span>
              <span id="menu-arrow" class="text-xs text-cyan-400">▼</span>
            </button>

            <div
              id="user-dropdown"
              class="glass-dropdown"
              style="
                display: none;
                position: absolute;
                top: 100%;
                right: 0;
                border-radius: 10px;
                margin-top: 0.5rem;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.9);
                z-index: 10000;
                min-width: 200px;
                overflow: hidden;
              "
            >
              <a href="/dashboard" class="user-dropdown-link">Dashboard</a>
              <a href="/profile" class="user-dropdown-link">Profile Settings</a>
              <button
                onclick="logout()"
                style="
                  width: 100%;
                  text-align: left;
                  padding: 0.75rem 1rem;
                  background: none;
                  border: none;
                  cursor: pointer;
                  color: #f87171;
                  font-weight: 500;
                  transition: background-color 0.2s;
                "
                onmouseover="
                  this.style.backgroundColor = 'rgba(239, 68, 68, 0.15)'
                "
                onmouseout="this.style.backgroundColor = 'transparent'"
              >
                Log out
              </button>
            </div>
          </div>

          <!-- Auth Links (shown when not logged in) -->
          <div
            id="auth-links"
            style="display: flex; gap: 1rem; align-items: center"
          >
            <a href="/register" class="nav-action-link nav-action-link-secondary"
              >Sign Up</a
            >
            <a href="/login" class="nav-action-link nav-action-link-primary"
              >Log In</a
            >
          </div>
        </div>
      </div>
    </nav>

    <main>{% block content %}{% endblock %}</main>

    <footer class="footer-shell">
      <p class="font-medium text-slate-400">&copy; 2026 ReadyAPI.net</p>
      <p class="mt-2 text-sm">
        <a href="/privacy-policy" class="footer-link" style="margin-right: 1rem"
          >Privacy Policy</a
        >
        |
        <span style="margin-left: 1rem">
          Contact:
          <a href="mailto:info@readyapi.net" class="footer-link">info@readyapi.net</a>
        </span>
      </p>
    </footer>

    <script>
      // Mobile menu toggle
      function toggleMobileMenu(event) {
        if (event) {
          event.preventDefault();
          event.stopPropagation();
        }
        const navMenu = document.getElementById("nav-menu");
        if (navMenu) {
          navMenu.classList.toggle("mobile-open");
        }
      }

      // Initialize hamburger button and menu listeners
      function initializeMenuListeners() {
        // Close menu when links are clicked
        document.querySelectorAll("#nav-menu a").forEach((link) => {
          link.addEventListener("click", () => {
            const navMenu = document.getElementById("nav-menu");
            if (navMenu && window.innerWidth <= 768) {
              navMenu.classList.remove("mobile-open");
            }
          });
        });
      }

      // Update hamburger button visibility
      function updateHamburgerMenu() {
        const hamburgerBtn = document.getElementById("hamburger-btn");
        const navMenu = document.getElementById("nav-menu");
        if (!hamburgerBtn || !navMenu) return;

        if (window.innerWidth <= 768) {
          hamburgerBtn.style.display = "block";
          navMenu.classList.remove("mobile-open");
        } else {
          hamburgerBtn.style.display = "none";
          navMenu.style.display = "flex";
        }
      }

      // Run on page load
      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", () => {
          initializeMenuListeners();
          updateHamburgerMenu();
        });
      } else {
        initializeMenuListeners();
        updateHamburgerMenu();
      }

      // Run on window resize
      let resizeTimeout;
      window.addEventListener("resize", () => {
        clearTimeout(resizeTimeout);
        resizeTimeout = setTimeout(updateHamburgerMenu, 150);
      });

      // Professional navbar with user menu
      function initializeNavbar() {
        const apiKey = localStorage.getItem("api_key");
        const userEmail = localStorage.getItem("user_email");

        const userMenu = document.getElementById("user-menu");
        const authLinks = document.getElementById("auth-links");
        const userEmailSpan = document.getElementById("user-email");

        if (!userMenu || !authLinks) {
          setTimeout(initializeNavbar, 100);
          return;
        }

        if (apiKey && userEmail) {
          // User is logged in
          userMenu.style.display = "block";
          authLinks.style.display = "none";
          if (userEmailSpan) userEmailSpan.textContent = userEmail;
        } else {
          // User is not logged in
          userMenu.style.display = "none";
          authLinks.style.display = "flex";
        }
      }

      function toggleUserMenu(event) {
        if (event) {
          event.preventDefault();
          event.stopPropagation();
        }
        const dropdown = document.getElementById("user-dropdown");
        const arrow = document.getElementById("menu-arrow");
        if (dropdown && arrow) {
          const isOpen = dropdown.style.display === "block";
          dropdown.style.display = isOpen ? "none" : "block";
          arrow.textContent = isOpen ? "▼" : "▲";
        }
      }

      function logout() {
        localStorage.removeItem("api_key");
        localStorage.removeItem("user_email");
        window.location.href = "/";
      }

      // Close dropdowns when clicking outside
      document.addEventListener("click", function (event) {
        const userMenu = document.getElementById("user-menu");
        const dropdown = document.getElementById("user-dropdown");
        const navMenu = document.getElementById("nav-menu");

        if (userMenu && dropdown && !userMenu.contains(event.target)) {
          dropdown.style.display = "none";
        }

        if (
          window.innerWidth <= 768 &&
          navMenu &&
          !navMenu.contains(event.target) &&
          event.target.id !== "hamburger-btn"
        ) {
          navMenu.classList.remove("mobile-open");
        }
      });

      // Initialize on DOMContentLoaded and load event
      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", initializeNavbar);
      } else {
        initializeNavbar();
      }
      window.addEventListener("load", initializeNavbar);

      // Mark active navigation link
      function markActiveNavLink() {
        const currentPath = window.location.pathname;
        document.querySelectorAll("#nav-menu a").forEach((link) => {
          const href = link.getAttribute("href");
          if (currentPath === href || currentPath.startsWith(href + "/")) {
            link.classList.add("active");
          } else {
            link.classList.remove("active");
          }
        });
      }

      // Initialize on load
      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", markActiveNavLink);
      } else {
        markActiveNavLink();
      }
      window.addEventListener("load", markActiveNavLink);
    </script>
  </body>
</html>
